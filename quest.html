<!DOCTYPE html>
<html>
<head>

  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Knightquest - Quest</title>

<!-- quest page is same page for all 5 quests and my
 script.js fileeee fills it in from the csv using ?id= -->
<body id="quest">
