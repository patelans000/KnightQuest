<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Knightquest - Inventory</title>
  <link rel="stylesheet" href="style.css">
</head>

<!-- inventory one slot per quest ad script.js fills the slots in -->
<body id="inventory">
  <div class="screen">
    <a class="home-link" href="home.html"><img src="assets/homebutton.png" alt="home"></a>

    <h2>Thy Inventory</h2>
    <p id="item-count">0 of 5 items found</p>

    <div class="item-grid" id="item-grid"></div>

    <p class="item-desc" id="item-desc">Tap an item to read about it.</p>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/p5@1.9.4/lib/p5.min.js"></script>
  <script src="script.js"></script>
</body>
</html>
